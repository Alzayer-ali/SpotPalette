# Builds the patched Command Palette on a GitHub-hosted Windows machine, so nothing
# (Visual Studio, SDKs, ...) has to be installed locally. The result is a signed MSIX
# plus an installer script, published as a workflow artifact and as a GitHub release.
name: Build SpotPalette

on:
  push:
    paths:
      - 'patches/**'
      - 'UPSTREAM_COMMIT'
      - 'scripts/**'
      - 'install/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # ARM64 is cross-compiled on the x64 runner.
        platform: [x64, ARM64]
    env:
      PT: ${{ github.workspace }}\PowerToys
      PLATFORM: ${{ matrix.platform }}
      CONFIGURATION: Release
      # The package is signed with a throwaway certificate created during this job.
      # Its subject must equal the Publisher in the package manifest.
      PUBLISHER: CN=SpotPalette
    steps:
      - name: Checkout SpotPalette
        uses: actions/checkout@v4

      - name: Fetch PowerToys and apply patches
        shell: pwsh
        run: ./scripts/setup.ps1 -Destination $env:PT

      - name: Use SpotPalette package identity
        shell: pwsh
        run: |
          # Give the dev package our own publisher so it can be signed here and installed
          # next to the official Command Palette.
          $manifest = Join-Path $env:PT 'src\modules\cmdpal\Microsoft.CmdPal.UI\Package-Dev.appxmanifest'
          $xml = Get-Content $manifest -Raw
          $xml = $xml -replace 'Publisher="CN=Microsoft Corporation[^"]*"', "Publisher=`"$env:PUBLISHER`""
          $xml = $xml -replace '<PublisherDisplayName>[^<]*</PublisherDisplayName>', '<PublisherDisplayName>SpotPalette</PublisherDisplayName>'

          # Windows refuses to install a package whose version equals the installed one but
          # whose contents differ, so every build gets a higher version: 1.0.<run number>.0.
          $xml = $xml -replace '(<Identity[^>]*?\sVersion=")[^"]*(")', "`${1}1.0.$env:GITHUB_RUN_NUMBER.0`${2}"
          Set-Content -Path $manifest -Value $xml -NoNewline
          Select-String -Path $manifest -Pattern 'Publisher|Version="' | ForEach-Object { $_.Line.Trim() }

      - name: Setup .NET (version from PowerToys global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PowerToys/global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.platform }}-${{ hashFiles('UPSTREAM_COMMIT') }}

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages.config (C++ projects)
        shell: pwsh
        working-directory: PowerToys
        run: |
          # The C++ projects use packages.config, which `msbuild -restore` does not cover for
          # every transitively referenced project. Restore them all into PowerToys\packages.
          $configs = Get-ChildItem src -Recurse -Filter packages.config |
            Where-Object { $_.FullName -match '\\src\\(common|modules\\cmdpal)\\' }
          foreach ($config in $configs) {
            nuget restore $config.FullName -PackagesDirectory packages -ConfigFile nuget.config -NonInteractive -Verbosity quiet
            if ($LASTEXITCODE -ne 0) { throw "nuget restore failed for $($config.FullName)" }
          }
          Write-Host "Restored $($configs.Count) packages.config files."

      - name: Build Command Palette
        shell: pwsh
        working-directory: PowerToys
        run: |
          msbuild src\modules\cmdpal\Microsoft.CmdPal.UI\Microsoft.CmdPal.UI.csproj `
            -restore -m -nologo -v:minimal `
            -p:RestorePackagesConfig=true `
            -p:Platform=$env:PLATFORM `
            -p:Configuration=$env:CONFIGURATION `
            -p:GeneratePackageLocally=true `
            -p:AppxPackageSigningEnabled=false `
            -p:CommandPaletteBranding=Dev `
            -p:SpotPaletteRelease=true `
            -bl:"$env:GITHUB_WORKSPACE\msbuild.binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign package
        id: sign
        shell: pwsh
        run: |
          $msix = Get-ChildItem $env:PT -Recurse -Filter '*.msix' |
            Where-Object { $_.FullName -match 'AppPackages' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw 'No .msix produced by the build.' }
          Write-Host "Package: $($msix.FullName)"

          # Throwaway code-signing certificate. The private key never leaves this job, so
          # trusting the public .cer on a PC cannot be used to sign anything else.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:PUBLISHER `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $plain = [Runtime.InteropServices.Marshal]::PtrToStringAuto([Runtime.InteropServices.Marshal]::SecureStringToBSTR($password))
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $plain $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }

          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $msix.FullName (Join-Path $out 'SpotPalette.msix')
          Export-Certificate -Cert $cert -FilePath (Join-Path $out 'SpotPalette.cer') | Out-Null
          Copy-Item install\* $out
          Remove-Item $pfx
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotPalette-${{ matrix.platform }}
          path: out/*

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlog-${{ matrix.platform }}
          path: msbuild.binlog
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: SpotPalette-*
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for dir in SpotPalette-*/; do
            name="${dir%/}"
            (cd "$name" && zip -q -r "../$name.zip" .)
          done
          ls -l *.zip
          tag="build-$GITHUB_RUN_NUMBER"
          notes="Built from $GITHUB_SHA on $GITHUB_REF_NAME.

          Download SpotPalette-ARM64.zip for ARM PCs (Snapdragon / Windows on ARM) or SpotPalette-x64.zip for Intel/AMD PCs. Extract it, then right-click Install.cmd > Run as administrator."
          gh release create "$tag" *.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SpotPalette build $GITHUB_RUN_NUMBER" --notes "$notes" --latest
